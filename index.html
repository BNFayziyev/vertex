<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Vertex - Architecture & Interior Design</title>
  <style>
    :root {
      --ink: #171717;
      --soft: #f4f1eb;
      --muted: #7d7d7d;
      --line: rgba(23, 23, 23, 0.12);
      --max: 1540px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--soft);
      color: var(--ink);
      font-family: Inter, Arial, Helvetica, sans-serif;
      letter-spacing: 0;
    }

    body.menu-open {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img,
    video,
    iframe {
      display: block;
      max-width: 100%;
    }

    .site-header {
      position: fixed;
      z-index: 20;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 28px;
      padding: 28px clamp(18px, 4vw, 64px);
      color: #fff;
      mix-blend-mode: difference;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: clamp(20px, 3vw, 44px);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .nav a {
      position: relative;
      padding: 8px 0;
    }

    .nav a::after {
      position: absolute;
      right: 100%;
      bottom: 3px;
      left: 0;
      height: 1px;
      background: currentColor;
      content: "";
      transition: right 180ms ease;
    }

    .nav a:hover::after,
    .nav a:focus-visible::after {
      right: 0;
    }

    .menu-button {
      display: none;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      background: transparent;
      color: currentColor;
      cursor: pointer;
    }

    .menu-button span,
    .menu-button::before,
    .menu-button::after {
      display: block;
      width: 16px;
      height: 1px;
      margin: 5px auto;
      background: currentColor;
      content: "";
      transition: transform 180ms ease, opacity 180ms ease;
    }

    .menu-open .menu-button span {
      opacity: 0;
    }

    .menu-open .menu-button::before {
      transform: translateY(6px) rotate(45deg);
    }

    .menu-open .menu-button::after {
      transform: translateY(-6px) rotate(-45deg);
    }

    .hero {
      position: relative;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #050505;
      color: #fff;
    }

    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: brightness(0.46) saturate(0.94) contrast(1.08);
    }

    .hero::after {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 48%, rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.54) 68%),
        rgba(0, 0, 0, 0.26);
      content: "";
    }

    .hero-logo {
      position: relative;
      z-index: 2;
      width: clamp(190px, 24vw, 430px);
      filter: drop-shadow(0 24px 55px rgba(0, 0, 0, 0.48));
    }

    .scroll-link {
      position: absolute;
      z-index: 3;
      right: clamp(22px, 5vw, 74px);
      bottom: clamp(24px, 5vw, 68px);
      display: grid;
      width: 54px;
      height: 54px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      color: #fff;
      font-size: 24px;
    }

    .section {
      width: min(100%, var(--max));
      margin: 0 auto;
      padding: clamp(64px, 9vw, 132px) clamp(16px, 4vw, 64px);
    }

    .portfolio-section {
      width: 100%;
      max-width: none;
      padding-right: 0;
      padding-left: 0;
    }

    .portfolio-section .section-head {
      width: min(calc(100% - clamp(32px, 8vw, 128px)), var(--max));
      margin-right: auto;
      margin-left: auto;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: clamp(28px, 4vw, 56px);
      border-bottom: 1px solid var(--line);
      padding-bottom: 22px;
    }

    .section-head h1,
    .section-head h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(36px, 7vw, 112px);
      font-weight: 400;
      line-height: 0.92;
    }

    .section-head span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .ribbon {
      width: 100vw;
      overflow: hidden;
      margin: 18px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: clamp(14px, 2vw, 24px) 0;
    }

    .ribbon-track {
      display: flex;
      width: max-content;
      gap: clamp(14px, 2vw, 26px);
      transform: translate3d(0, 0, 0);
      will-change: transform;
    }

    .ribbon-card {
      flex: 0 0 clamp(240px, 31vw, 530px);
      height: clamp(180px, 31vw, 470px);
      overflow: hidden;
      background: #ddd7cf;
    }

    .ribbon-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 500ms ease, filter 500ms ease;
    }

    .ribbon:hover .ribbon-card img {
      filter: saturate(1.04) contrast(1.03);
    }

    .ribbon-card:hover img {
      transform: scale(1.045);
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(14px, 2vw, 28px);
    }

    .video-card {
      position: relative;
      min-height: clamp(420px, 58vw, 720px);
      overflow: hidden;
      background: #0d0d0d;
    }

    .video-card video {
      width: 100%;
      height: 100%;
      min-height: inherit;
      object-fit: cover;
      filter: brightness(0.76) contrast(1.04);
    }

    .video-card span {
      position: absolute;
      left: 18px;
      bottom: 16px;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.65);
    }

    .contact-band {
      background: #fff;
    }

    .contact {
      display: grid;
      grid-template-columns: minmax(160px, 0.72fr) 1fr 1fr 1.1fr;
      gap: clamp(26px, 5vw, 90px);
      width: min(100%, var(--max));
      margin: 0 auto;
      padding: clamp(56px, 7vw, 108px) clamp(18px, 4vw, 64px);
      align-items: start;
    }

    .contact-logo {
      width: clamp(130px, 15vw, 230px);
      filter: invert(1);
    }

    .contact-block {
      display: grid;
      gap: 14px;
      color: #767676;
      font-size: clamp(14px, 1.45vw, 18px);
      line-height: 1.45;
    }

    .contact-block b {
      color: var(--ink);
      font-weight: 600;
    }

    .contact-block a {
      width: fit-content;
      border-bottom: 1px solid currentColor;
      color: #111;
    }

    .socials {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }

    .socials a {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: #777;
      font-size: 11px;
      font-weight: 800;
    }

    .copyright {
      margin-top: 28px;
      color: #888;
      font-size: 12px;
    }

    .map {
      height: clamp(420px, 55vw, 620px);
      overflow: hidden;
      background: #d7d7d7;
      filter: grayscale(1) contrast(0.84) brightness(1.05);
    }

    .map iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 700ms ease, transform 700ms ease;
    }

    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 900px) {
      .site-header {
        mix-blend-mode: normal;
      }

      .menu-button {
        display: block;
        position: relative;
        z-index: 22;
      }

      .nav {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 22px;
        background: rgba(10, 10, 10, 0.94);
        color: #fff;
        font-size: 18px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease;
      }

      .menu-open .nav {
        opacity: 1;
        pointer-events: auto;
      }

      .section-head {
        display: grid;
        align-items: start;
      }

      .video-grid,
      .contact {
        grid-template-columns: 1fr;
      }

      .video-card {
        min-height: 72svh;
      }

      .contact {
        gap: 30px;
      }
    }

    @media (max-width: 560px) {
      .site-header {
        padding: 18px;
      }

      .ribbon-card {
        flex-basis: 78vw;
        height: 70vw;
      }

      .scroll-link {
        width: 46px;
        height: 46px;
        font-size: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 1ms !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>

  <script>
    const menuButton = document.querySelector(".menu-button");
    const navLinks = document.querySelectorAll(".nav a");

    menuButton.addEventListener("click", () => {
      const isOpen = document.body.classList.toggle("menu-open");
      menuButton.setAttribute("aria-expanded", String(isOpen));
    });

    navLinks.forEach((link) => {
      link.addEventListener("click", () => {
        document.body.classList.remove("menu-open");
        menuButton.setAttribute("aria-expanded", "false");
      });
    });

    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add("is-visible");
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });

    document.querySelectorAll(".reveal").forEach((element) => {
      revealObserver.observe(element);
    });

    const playableVideos = Array.from(document.querySelectorAll(".video-card video"));
    const videoObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        const video = entry.target;
        if (entry.isIntersecting) {
          video.play().catch(() => {});
        } else {
          video.pause();
        }
      });
    }, { threshold: 0.38 });

    playableVideos.forEach((video) => {
      video.pause();
      videoObserver.observe(video);
    });

    const ribbons = Array.from(document.querySelectorAll(".ribbon"));

    ribbons.forEach((ribbon, index) => {
      const track = ribbon.querySelector(".ribbon-track");
      if (!track || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        return;
      }

      const state = {
        position: 0,
        velocity: 0,
        targetVelocity: 0,
        lastTime: 0,
        frame: 0,
        direction: index % 2 === 0 ? 1 : -1
      };

      const cycleWidth = () => track.scrollWidth / 2;

      const animate = (time) => {
        if (!state.lastTime) {
          state.lastTime = time;
        }

        const delta = Math.min(time - state.lastTime, 32);
        state.lastTime = time;
        state.velocity += (state.targetVelocity - state.velocity) * 0.08;
        state.position += state.velocity * delta;

        const width = cycleWidth();
        if (width > 0) {
          state.position = ((state.position % width) + width) % width;
          track.style.transform = `translate3d(${-state.position}px, 0, 0)`;
        }

        if (Math.abs(state.velocity) > 0.004 || Math.abs(state.targetVelocity) > 0.004) {
          state.frame = window.requestAnimationFrame(animate);
        } else {
          state.velocity = 0;
          state.lastTime = 0;
          state.frame = 0;
        }
      };

      const start = () => {
        const speed = Math.max(cycleWidth() / 26000, 0.04);
        state.targetVelocity = speed * state.direction;
        if (!state.frame) {
          state.frame = window.requestAnimationFrame(animate);
        }
      };

      const stop = () => {
        state.targetVelocity = 0;
        if (!state.frame) {
          state.frame = window.requestAnimationFrame(animate);
        }
      };

      ribbon.addEventListener("pointerenter", start);
      ribbon.addEventListener("pointerleave", stop);
      ribbon.addEventListener("focusin", start);
      ribbon.addEventListener("focusout", stop);

      window.addEventListener("load", () => {
        if (state.direction < 0) {
          state.position = cycleWidth();
          track.style.transform = `translate3d(${-state.position}px, 0, 0)`;
        }
      }, { once: true });
    });
  </script>
